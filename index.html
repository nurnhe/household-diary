<meta name="theme-color" content="#141A17" media="(prefers-color-scheme: dark)">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>Household Diary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: a "today" board of chores that are due (one card per room), the week as seven day cards, and a supplies list with a shopping list.
   Look: linen paper, forest green and mustard, flat cards with soft corners. Fraunces for headings, Manrope for everything else. */
:root {
  --bg: #F4F1EA; --bg-2: #EEE9DE;
  --surface: #FFFDF8; --surface-2: #F8F5EE; --ink: #1F2A24; --muted: #6B776E; --line: rgba(31, 42, 36, .12);
  --accent: #2F6B4F; --accent-ink: #FFFFFF; --accent-soft: #DDEBE1; --sun: #E0A43A; --sun-soft: #FBEFD6;
  --warn: #B5532F; --warn-soft: #F7E3D7; --ok: #2F6B4F;
  --shadow: 0 1px 0 rgba(31, 42, 36, .04), 0 6px 18px rgba(31, 42, 36, .06);
  --shadow-lg: 0 18px 50px rgba(31, 42, 36, .22);
  --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
  --sans: "Manrope", "Avenir Next", "Segoe UI", sans-serif;
  --s0: #D9897A; --s1: #6FA8C9; --s2: #E07B5F; --s3: #74A886; --s4: #E0A43A; --s5: #A77BB0; --s6: #8C93D4; --s7: #C98A6B; --s8: #E98F3C; --s9: #5FB0A8;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141A17; --bg-2: #18201C; --surface: #1E2723; --surface-2: #232D28; --ink: #ECE8DE; --muted: #9DA79F; --line: rgba(236, 232, 222, .12);
  --accent: #8CCFA8; --accent-ink: #11201A; --accent-soft: #23392D; --sun: #E9B95C; --sun-soft: #3A3020;
  --warn: #E89B79; --warn-soft: #3B2620; --ok: #8CCFA8;
  --shadow: 0 1px 0 rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.3); --shadow-lg: 0 18px 50px rgba(0,0,0,.6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141A17; --bg-2: #18201C; --surface: #1E2723; --surface-2: #232D28; --ink: #ECE8DE; --muted: #9DA79F; --line: rgba(236, 232, 222, .12);
  --accent: #8CCFA8; --accent-ink: #11201A; --accent-soft: #23392D; --sun: #E9B95C; --sun-soft: #3A3020;
  --warn: #E89B79; --warn-soft: #3B2620; --ok: #8CCFA8;
  --shadow: 0 1px 0 rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.3); --shadow-lg: 0 18px 50px rgba(0,0,0,.6); color-scheme: dark }

* { box-sizing: border-box }
html { min-height: 100% }
body { margin: 0; min-height: 100%; color: var(--ink); font: 400 15px/1.55 var(--sans); background: linear-gradient(180deg, var(--bg), var(--bg-2)) fixed; background-color: var(--bg) }
.bottom-nav { display: none }
@media (max-width: 700px) {
  header.top nav.tabs { display: none }
  .brand h1 { font-size: 34px }
  .brand .eyebrow { display: none }
  .wrap { padding-block: 18px calc(92px + env(safe-area-inset-bottom, 0px)); gap: 16px }
  .bottom-nav { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    padding: 0 max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
    background: var(--surface); border-top: 1px solid var(--line) }
  .bottom-nav button { position: relative; border: 0; background: none; display: grid; justify-items: center; gap: 3px; padding: 10px 0 6px; font-size: 11.5px; font-weight: 600; color: var(--muted); -webkit-tap-highlight-color: transparent }
  .bottom-nav button::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: transparent; transition: background .2s }
  .bottom-nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
  .bottom-nav button[aria-current="page"] { color: var(--accent) }
  .bottom-nav button[aria-current="page"]::before { background: var(--accent) }
  .today { padding: 12px; gap: 12px }
  .today-intro { padding: 6px 6px 0 }
  .area { padding: 12px 6px 6px 10px }
  .steps li { gap: 2px }
  .step { grid-template-columns: 24px 32px minmax(0, 1fr); gap: 9px; padding: 6px 2px }
  .step .thumb { width: 32px !important; height: 32px !important }
  .steps .skip-btn { padding: 5px 6px; font-size: 12px; line-height: 1.25; white-space: normal; width: 74px; text-align: center; border-color: var(--line); background: var(--surface) }
}
.wrap { max-width: 1200px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px }
h1, h2, h3 { margin: 0; font-family: var(--serif); text-wrap: balance; font-variation-settings: "SOFT" 100 }
h1 { font-size: clamp(38px, 6vw, 56px); font-weight: 600; line-height: 1; letter-spacing: -.025em }
h1 em, h2 em { font-style: normal; color: var(--accent) }
h1 em { position: relative }
h1 em::after { content: ""; position: absolute; left: 0; right: 0; bottom: .02em; height: .14em; border-radius: 99px; background: var(--sun); opacity: .75; z-index: -1 }
h2 { font-size: 26px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em }
h3 { font-size: 19px; font-weight: 600; line-height: 1.2 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted) }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 24px }
.brand { display: grid; gap: 4px; isolation: isolate }
nav.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line) }
nav.tabs button { border: 0; background: none; padding: 8px 2px 10px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .2s, border-color .2s }
nav.tabs button:hover { color: var(--ink) }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-color: var(--accent) }

.glass { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow) }

/* Today */
.today { padding: 22px; display: grid; grid-template-columns: minmax(190px, .7fr) minmax(0, 2fr); gap: 18px; align-items: start }
.today-intro { display: grid; align-content: start; gap: 16px; padding: 4px; min-width: 0 }
.today-intro .date { font-family: var(--serif); font-size: 34px; font-weight: 600; line-height: 1.05; letter-spacing: -.015em }
.today-intro .date em { font-style: normal; color: var(--accent) }
.areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-items: start; min-width: 0 }
.area { --c: var(--s0); border-radius: 12px; padding: 14px 12px 8px 16px; display: grid; gap: 6px; align-content: start; min-width: 0;
  background: var(--surface-2); border: 1px solid var(--line); box-shadow: inset 4px 0 0 var(--c) }
.area-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-inline: 4px }
.count { font-size: 12.5px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px }
.steps li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; font-size: 15px }
.step { display: grid; grid-template-columns: 22px 40px minmax(0, 1fr); gap: 10px; align-items: center; padding: 5px 6px; border-radius: 10px; cursor: pointer; transition: background .15s }
.step:hover { background: color-mix(in srgb, var(--ink) 4%, transparent) }
.step input { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; margin: 0; border-radius: 7px; border: 1.75px solid color-mix(in srgb, var(--muted) 70%, transparent); background: var(--surface); display: grid; place-items: center; cursor: pointer; transition: background .15s, border-color .15s }
.step input::after { content: "✓"; font-size: 13px; font-weight: 700; line-height: 1; color: var(--accent-ink); opacity: 0 }
.step input:checked { background: var(--ok); border-color: var(--ok) }
.step input:checked::after { opacity: 1 }
.step .txt { overflow-wrap: anywhere; font-weight: 500 }
.step .sub { display: block; font-size: 12.5px; font-weight: 400; color: var(--muted) }
.sub .late { color: var(--warn); font-weight: 600 }
.steps li.done .nm { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 70%, transparent) }
.skip-btn { border: 1px solid transparent; background: none; border-radius: 8px; padding: 3px 9px; font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap }
.skip-btn:hover { border-color: var(--line); background: var(--surface); color: var(--accent) }
.thumb { display: inline-grid; place-items: center; border-radius: 10px; flex: none; background: var(--surface) }
.thumb.icon { background: color-mix(in srgb, var(--c) 18%, var(--surface)) }
.thumb.icon svg { width: 58%; height: 58%; color: color-mix(in srgb, var(--c) 75%, var(--ink)) }
.mini-icon { width: 14px; height: 14px; color: color-mix(in srgb, var(--c) 75%, var(--ink)); display: grid }
.mini-icon svg { width: 14px; height: 14px }
.icon-grid { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px }
.icon-grid button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: color-mix(in srgb, var(--c) 75%, var(--ink)); display: grid; place-items: center }
.icon-grid button svg { width: 22px; height: 22px }
.icon-grid button[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 20%, var(--surface)); border: 2px solid var(--c) }
.complete-badge { justify-self: start; display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 8px }
.complete-badge.small { font-size: 11.5px; padding: 2px 8px; margin-inline: 4px }
.progress { display: grid; gap: 8px; font-size: 14px; font-weight: 600 }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden }
.bar span { display: block; height: 100%; border-radius: 99px; background: var(--ok); transition: width .25s }
.low-card { display: grid; gap: 8px; padding: 14px; border-radius: 12px; background: var(--sun-soft); border: 1px solid color-mix(in srgb, var(--sun) 35%, transparent) }
.low-card .eyebrow { color: color-mix(in srgb, var(--sun) 55%, var(--ink)) }
.low-card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px }
.low-card li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; align-items: center }
.all-done { display: grid; gap: 6px; justify-items: start; padding: 18px; border-radius: 12px; background: var(--accent-soft) }
.all-done p { margin: 0 }

/* Week */
.weekbar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px }
.weekbar h2 { margin-right: auto }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600; transition: border-color .2s, background .2s; text-decoration: none }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--ink)) }
.btn.ghost { background: none; border-color: transparent; color: var(--muted) }
.btn.small { padding: 5px 11px; font-size: 13px; border-radius: 8px }
.btn.danger { color: var(--warn); border-color: var(--warn) }
.pager { display: flex; gap: 6px }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px }
.day { padding: 12px 10px 12px; border-radius: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; color: var(--ink) }
.day.is-today { border: 2px solid var(--sun) }
.day.is-past { background: var(--surface-2); box-shadow: none }
.day.is-complete { background: color-mix(in srgb, var(--ok) 8%, var(--surface)) }
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding-inline: 4px }
.day-head .dow { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted) }
.day-head .num { font-family: var(--serif); font-size: 30px; font-weight: 600; line-height: .95; font-variant-numeric: tabular-nums }
.day.is-today .num { color: var(--accent) }
.day ol { margin: 0; padding: 0; list-style: none; font-size: 13px; display: grid; gap: 3px }
.day li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 7px; align-items: center; overflow-wrap: anywhere; line-height: 1.35; padding-inline: 4px }
.day li.done > span:nth-child(2) { color: var(--muted) }
.day .empty { font-size: 13px; color: var(--muted); padding-inline: 4px }
.tick { font-size: 11px; color: var(--ok); font-weight: 800 }
.tick.late { color: var(--warn) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted) }
.legend span { display: inline-flex; gap: 6px; align-items: center }
.dot { width: 8px; height: 8px; border-radius: 3px; background: var(--c, var(--muted)) }

@media (max-width: 1000px) {
  .today { grid-template-columns: minmax(0, 1fr) }
  .today-intro { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between }
  .week { grid-template-columns: minmax(0, 1fr) }
  .day { grid-template-columns: 64px minmax(0, 1fr); align-items: start }
  .day-head { flex-direction: column; align-items: start; gap: 2px; grid-row: span 3 }
}
@media (max-width: 600px) {
  .areas { grid-template-columns: minmax(0, 1fr) }
  .day { grid-template-columns: minmax(0, 1fr) }
  .day-head { grid-row: auto; flex-direction: row; align-items: baseline; justify-content: start; gap: 10px }
}

.panel { padding: 22px; display: grid; gap: 14px; min-width: 0 }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 12px }
.empty-state { text-align: center; padding: 48px 20px; display: grid; gap: 12px; justify-items: center }
.empty-state p { max-width: 46ch; margin: 0 }

/* Lists of chores and supplies */
.group { display: grid; gap: 6px }
.group > .eyebrow { display: flex; align-items: center; gap: 8px; padding: 6px 4px 0 }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 10px 6px 6px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line) }
.row .nm { font-weight: 600; overflow-wrap: anywhere }
.row .meta { font-size: 13px; color: var(--muted) }
.row.is-low { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 25%, transparent) }
.row-main { border: 0; background: none; padding: 2px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; border-radius: 10px; min-width: 0; -webkit-tap-highlight-color: transparent }
.row-main .thumb { width: 44px !important; height: 44px !important }
.row-main:hover .nm { color: var(--accent) }
.acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: end; align-items: center }
.low-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; white-space: nowrap }
.low-btn:hover { border-color: var(--warn); color: var(--warn) }
.low-btn[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: var(--surface) }
.shop { display: grid; gap: 2px }
.shop .step { grid-template-columns: 22px 34px minmax(0, 1fr) }
.add-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px }
.hint { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--sun-soft); font-size: 14px; font-weight: 500 }
.hint .sub { display: block; font-size: 12px; font-weight: 400; color: var(--muted) }
.field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted) }
.input { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 12px; color: var(--ink); width: 100%; min-width: 0; font-weight: 400 }
.input:focus { border-color: var(--accent); background: var(--surface) }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px }

/* Sheet: slides up from the bottom on phones, in from the right on wider screens */
.scrim { position: fixed; inset: 0; background: rgba(15, 22, 18, .45); z-index: 20 }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); z-index: 21; box-shadow: var(--shadow-lg);
  display: grid; grid-template-rows: auto minmax(0, 1fr); border-left: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px) }
@media (max-width: 520px) { .sheet { top: auto; max-height: 92vh; width: 100%; border-left: 0; border-radius: 18px 18px 0 0 } }
.sheet-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; padding: 20px 20px 14px; border-bottom: 1px solid var(--line) }
.sheet-head h2 { font-size: 26px; overflow-wrap: anywhere }
.sheet-body { overflow-y: auto; padding: 18px 20px 28px; display: grid; gap: 18px; align-content: start }
.sheet-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.sheet-foot .spacer { margin-right: auto }
.status { font-size: 12px; color: var(--muted); margin: 0 }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 30; box-shadow: var(--shadow-lg); width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 12px }
.toast[hidden] { display: none }
.toast button { flex: none; border: 0; background: none; color: var(--sun); font-weight: 800; padding: 6px 4px; margin: -6px -4px -6px 0 }
@media (max-width: 700px) { .toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)) } }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: slide .25s cubic-bezier(.2, .8, .2, 1) } @keyframes slide { from { transform: translateX(40px); opacity: .5 } }
  @media (max-width: 520px) { .sheet { animation-name: rise } @keyframes rise { from { transform: translateY(60px); opacity: .5 } } }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Chores &amp; supplies</span>
      <h1>Household <em>Diary</em></h1>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-act="tab" data-tab="today" aria-selected="true">Today</button>
      <button role="tab" data-act="tab" data-tab="week" aria-selected="false">Week</button>
      <button role="tab" data-act="tab" data-tab="chores" aria-selected="false">Chores</button>
      <button role="tab" data-act="tab" data-tab="supplies" aria-selected="false">Supplies</button>
    </nav>
  </header>
  <main id="main" style="display:grid;gap:26px"></main>
  <p class="status" id="status"></p>
</div>
<nav class="bottom-nav" aria-label="Views">
  <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true" data-nav="today"></svg><span>Today</span></button>
  <button data-act="tab" data-tab="week"><svg viewBox="0 0 24 24" aria-hidden="true" data-nav="week"></svg><span>Week</span></button>
  <button data-act="tab" data-tab="chores"><svg viewBox="0 0 24 24" aria-hidden="true" data-nav="chores"></svg><span>Chores</span></button>
  <button data-act="tab" data-tab="supplies"><svg viewBox="0 0 24 24" aria-hidden="true" data-nav="supplies"></svg><span>Supplies</span></button>
</nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
const DOW = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
/* Each area has its own tint, used for icon tiles and the Today groups. */
const AREA_ORDER = ["Kitchen", "Bathroom", "Laundry", "Bedroom", "Home"];
const AREA_TINT = { Kitchen: 4, Bathroom: 1, Laundry: 6, Bedroom: 7, Home: 3 };
const tintOf = area => AREA_TINT[area] ?? [0, 2, 5, 8, 9][[...String(area)].reduce((n, c) => n + c.charCodeAt(0), 0) % 5];
const areaRank = a => { const i = AREA_ORDER.indexOf(a); return i < 0 ? 99 : i };

/* ---------- dates ---------- */
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x }
function keyOf(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") }
function fromKey(k) { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d) }
const todayKey = () => keyOf(new Date());
const dayNum = k => { const [y, m, d] = k.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5) };
const keyAdd = (k, n) => keyOf(addDays(fromKey(k), n));
const short = k => fromKey(k).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
function when(k) {
  const n = dayNum(k) - dayNum(todayKey());
  return n === 0 ? "today" : n === 1 ? "tomorrow" : n === -1 ? "yesterday" : n < 0 ? `${-n} days ago` : n < 7 ? DOW[fromKey(k).getDay()] : short(k);
}

  ? `<svg viewBox="${i.v}" fill="none" aria-hidden="true">${i.d}</svg>`
  : `<svg viewBox="${i.v}" fill="currentColor" aria-hidden="true">${i.d}</svg>` };
const thumb = (x, kind, size = 40) => `<span class="thumb icon" style="width:${size}px;height:${size}px;--c:var(--s${tintOf(x.area)})" aria-hidden="true">${svgIcon(iconOf(x, kind))}</span>`;
const miniIcon = (x, kind) => `<span class="mini-icon" style="--c:var(--s${tintOf(x.area)})">${svgIcon(iconOf(x, kind))}</span>`;
/* A toast can offer Undo, which puts back whatever the last action changed. */
function toast(msg, undo) {
  const t = document.getElementById("toast"); toast.undo = undo || null;
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button data-act="undo">Undo</button>` : ""}`; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; toast.undo = null }, undo ? 6000 : 3200);
}
function setStatus(s) { document.getElementById("status").textContent = s }

/* ---------- schedule ----------
   A chore keeps its next due date (due) and the days it was done (done, newest last).
   Ticking it today moves due to today + every; unticking puts the old due date back. */
const doneOn = (c, k) => (c.done || []).includes(k);
const doneToday = c => doneOn(c, todayKey());
const isDue = c => c.due <= todayKey();
const lateBy = c => dayNum(todayKey()) - dayNum(c.due);
function dueOn(c, k) {
  const t = todayKey(); if (k < t) return false;
  const base = c.due < t ? (doneToday(c) ? c.due : t) : c.due, n = dayNum(k) - dayNum(base);
  return n >= 0 && n % Math.max(1, c.every) === 0;
}
function todayList() { return chores().filter(c => isDue(c) || doneToday(c)) }
function tick(id) {
  const c = { ...state.chores[id] }, t = todayKey(), done = (c.done || []).filter(k => k !== t);
  if (doneToday(c)) { c.due = c.prevDue || t; delete c.prevDue }
  else { c.prevDue = c.due; c.due = keyAdd(t, c.every); done.push(t) }
  c.done = done.slice(-40); saveItem("chores", c);
}
function later(id) { const prev = state.chores[id], c = { ...prev, due: keyAdd(todayKey(), 1) }; saveItem("chores", c); toast(`Moved “${c.name}” to tomorrow.`, () => saveItem("chores", prev)) }
/* Starter chores are spread out so the first day isn't everything at once. */
function staggered(list) {
  const t = todayKey(), seen = {}, total = {};
  list.forEach(c => total[c.every] = (total[c.every] || 0) + 1);
  return list.map(c => { const j = seen[c.every] = (seen[c.every] ?? -1) + 1; return { ...c, due: keyAdd(t, c.every === 1 ? 0 : Math.floor((j + 1) * c.every / (total[c.every] + 1))) } });
}

/* ---------- supplies ----------
   low = on the shopping list. bought = the last day it was bought, which drives the "running out soon" hints. */
const runsOutOn = s => s.bought && s.lasts ? keyAdd(s.bought, s.lasts) : null;
const soon = s => !s.low && runsOutOn(s) && dayNum(runsOutOn(s)) - dayNum(todayKey()) <= 5;
function setLow(id, low) { const s = { ...state.supplies[id], low }; if (!low) delete s.low; saveItem("supplies", s) }
function bought(id) { const prev = state.supplies[id], s = { ...prev, bought: todayKey() }; delete s.low; saveItem("supplies", s); toast(`Marked ${s.name} as bought. It's off your shopping list.`, () => saveItem("supplies", prev)) }
const shoppingList = () => [...supplies().filter(s => s.low).map(s => ({ ...s, kind: "supply" })), ...Object.values(state.shopping).sort((a, b) => a.added - b.added).map(x => ({ ...x, kind: "extra" }))];

/* ---------- storage ---------- */
const LKEY = "household-diary-v1";
function loadLocal() {
  let data = {};
  try { data = JSON.parse(localStorage.getItem(LKEY) || "{}") } catch (e) {}
  state.chores = data.chores || {}; state.supplies = data.supplies || {}; state.shopping = data.shopping || {};
  state.loaded = true; state.mode = "local";
  setStatus("Your household diary is saved in this browser on this device.");
  render();
}
function persistLocal() { try { localStorage.setItem(LKEY, JSON.stringify({ chores: state.chores, supplies: state.supplies, shopping: state.shopping })) } catch (e) { toast("Couldn't save on this device. Free up some browser storage and try again.") } }
const chains = {};
function queue(path, fn) {
  chains[path] = (chains[path] || Promise.resolve()).then(fn)
    .catch(e => toast(e?.code === "quota_exceeded" ? "Storage is full. Remove some chores or supplies and try again." : "Couldn't save that change. Check your connection and try again."));
}
function saveItem(coll, item) {
  state[coll][item.id] = item;
  if (state.mode === "db") queue(coll + "/" + item.id, () => db.doc(coll + "/" + item.id).set(item)); else persistLocal();
  render();
}
function removeItem(coll, id) {
  delete state[coll][id];
  if (state.mode === "db") queue(coll + "/" + id, () => db.doc(coll + "/" + id).delete()); else persistLocal();
  render();
}
function useStarter() {
  const cs = staggered(STARTER.chores.map(([id, name, area, every]) => ({ id, name, area, every, ...(STARTER_ICON[id] ? { icon: STARTER_ICON[id] } : {}), done: [] })));
  const ss = STARTER.supplies.map(([id, name, area, lasts]) => ({ id, name, area, lasts, ...(STARTER_ICON[id] ? { icon: STARTER_ICON[id] } : {}) }));
  cs.forEach(c => { if (!state.chores[c.id]) saveItem("chores", c) });
  ss.forEach(s => { if (!state.supplies[s.id]) saveItem("supplies", s) });
  toast(`Added ${cs.length} chores and ${ss.length} supplies. Change or remove any of them under Chores and Supplies.`);
}

/* ---------- render ---------- */
function render() {
  const tab = state.tab;
  document.querySelectorAll(".bottom-nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  const main = document.getElementById("main"), a = document.activeElement;
  if (main.contains(a) && a.matches("input:not([type=checkbox]), textarea")) { renderSheet(); return }
  const empty = !Object.keys(state.chores).length && !Object.keys(state.supplies).length;
  if (!state.loaded) main.innerHTML = `<div class="glass empty-state"><p class="muted">Loading your household diary…</p></div>`;
  else if (empty && tab !== "chores" && tab !== "supplies") main.innerHTML = emptyState();
  else if (tab === "today") main.innerHTML = renderToday();
  else if (tab === "week") main.innerHTML = renderWeek();
  else if (tab === "chores") main.innerHTML = renderChores();
  else main.innerHTML = renderSupplies();
  renderSheet();
}
function emptyState() {
  return `<div class="glass empty-state"><h2>Welcome to your <em>household diary</em></h2><p class="muted">Plan your chores, tick them off as you go, and keep track of the things you need to buy. Start with a typical list and trim it, or add your own one at a time.</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center"><button class="btn primary" data-act="starter">Use the starter list</button><button class="btn" data-act="new-chore">Add a chore</button></div></div>`;
}
function choreRow(c) {
  const d = doneToday(c), late = !d && lateBy(c) > 0;
  const sub = d ? `Done · next ${when(c.due)}` : late ? `<span class="late">${lateBy(c) === 1 ? "Since yesterday" : `${lateBy(c)} days overdue`}</span> · ${freqLabel(c.every).toLowerCase()}` : freqLabel(c.every);
  return `<li class="${d ? "done" : ""}"><label class="step">
    <input type="checkbox" data-act="tick" data-id="${c.id}"${d ? " checked" : ""} aria-label="${esc(c.name)}">
    ${thumb(c, "chore", 40)}<span class="txt"><span class="nm">${esc(c.name)}</span><span class="sub">${sub}</span></span></label>
    ${d ? "" : `<button class="skip-btn" data-act="later" data-id="${c.id}" title="Move this chore to tomorrow">Move to tomorrow</button>`}</li>`;
}
function renderToday() {
  const k = todayKey(), d = fromKey(k), list = todayList(), doneN = list.filter(doneToday).length;
  const groups = byArea(list).map(([area, cs]) => `<div class="area" style="--c:var(--s${tintOf(area)})">
    <div class="area-head"><h3>${esc(area)}</h3><span class="count">${cs.filter(doneToday).length} of ${cs.length}</span></div>
    <ol class="steps">${cs.map(choreRow).join("")}</ol></div>`).join("");
  const next = chores().filter(c => !isDue(c) && !doneToday(c)).sort((a, b) => a.due.localeCompare(b.due))[0];
  const shop = shoppingList(), hints = supplies().filter(soon);
  const lowCard = shop.length || hints.length ? `<div class="low-card"><span class="eyebrow">Shopping list</span>
      ${shop.length ? `<ul>${shop.slice(0, 6).map(s => `<li>${s.kind === "supply" ? miniIcon(s, "supply") : `<span class="dot" aria-hidden="true"></span>`}<span>${esc(s.name)}</span></li>`).join("")}</ul>${shop.length > 6 ? `<span class="muted" style="font-size:13px">and ${shop.length - 6} more</span>` : ""}` : ""}
      ${hints.length ? `<span class="muted" style="font-size:13px">${hints.length === 1 ? esc(hints[0].name) + " may" : hints.length + " things may"} run out soon.</span>` : ""}
      <button class="btn small" data-act="tab" data-tab="supplies" style="justify-self:start">Open supplies</button></div>` : "";
  return `<section class="glass today" aria-label="Today">
    <div class="today-intro">
      <div style="display:grid;gap:6px"><span class="eyebrow">Today</span>
        <div class="date">${DOW[d.getDay()]}<br><em>${d.toLocaleDateString(undefined, { day: "numeric", month: "long" })}</em></div></div>
      ${list.length ? `<div class="progress">${doneN === list.length ? `<span class="complete-badge">✓ All done for today</span>` : `<span>${doneN} of ${list.length} done</span>`}
        <div class="bar" style="width:min(220px,100%)"><span style="width:${doneN / list.length * 100}%"></span></div></div>` : ""}
      ${lowCard}
    </div>
    ${list.length ? `<div class="areas">${groups}</div>` : `<div class="all-done"><h3>Nothing due today</h3><p class="muted">${next ? `Next up: ${esc(next.name)}, ${when(next.due)}.` : "Add a chore to get started."}</p></div>`}
  </section>`;
}
function renderWeek() {
  const ws = state.weekStart, we = addDays(ws, 6), tk = todayKey();
  const fmt = d => d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  let cells = "";
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i), k = keyOf(d), past = k < tk;
    const list = k === tk ? todayList() : chores().filter(c => past ? doneOn(c, k) : dueOn(c, k));
    const allDone = list.length && (past || list.every(c => doneOn(c, k)));
    const items = list.length ? `<ol>${list.map(c => { const dn = doneOn(c, k), late = k === tk && !dn && lateBy(c) > 0;
      return `<li class="${dn ? "done" : ""}">${miniIcon(c, "chore")}<span>${esc(c.name)}</span>${dn ? `<span class="tick" aria-label="done">✓</span>` : late ? `<span class="tick late" aria-label="overdue">!</span>` : ""}</li>` }).join("")}</ol>`
      : `<div class="empty">${past ? "Nothing ticked" : "Nothing due"}</div>`;
    cells += `<div class="glass day${k === tk ? " is-today" : past ? " is-past" : ""}${allDone && !past ? " is-complete" : ""}">
      <div class="day-head"><span class="dow">${DOW[d.getDay()].slice(0, 3)}</span><span class="num">${d.getDate()}</span></div>
      ${allDone && !past ? `<span class="complete-badge small">✓ All done</span>` : ""}${items}</div>`;
  }
  const used = [...new Set(chores().map(c => c.area))];
  return `<section style="display:grid;gap:14px">
    <div class="weekbar"><h2>${fmt(ws)} – ${fmt(we)}</h2>
      <div class="pager"><button class="btn small" data-act="week" data-n="-1" aria-label="Previous week">←</button>
      <button class="btn small" data-act="week" data-n="0">This week</button>
      <button class="btn small" data-act="week" data-n="1" aria-label="Next week">→</button></div></div>
    <div class="week">${cells}</div>
    <div class="legend">${used.map(a => `<span><span class="dot" style="--c:var(--s${tintOf(a)})"></span>${esc(a)}</span>`).join("")}<span>Past days show what you ticked. Coming days show what's planned.</span></div>
  </section>`;
}
function renderChores() {
  const groups = byArea(chores()).map(([area, cs]) => `<div class="group"><span class="eyebrow"><span class="dot" style="--c:var(--s${tintOf(area)})"></span>${esc(area)}</span>
    ${cs.map(c => `<div class="row"><button class="row-main" data-act="edit-chore" data-id="${c.id}" aria-label="Edit ${esc(c.name)}">${thumb(c, "chore", 48)}
      <span style="min-width:0"><span class="nm" style="display:block">${esc(c.name)}</span><span class="meta">${freqLabel(c.every)} · ${doneToday(c) ? "done today" : isDue(c) ? "due today" : "next " + when(c.due)}</span></span></button></div>`).join("")}</div>`).join("");
  return `<section class="glass panel"><div class="panel-head"><h2>Your <em>chores</em></h2><button class="btn primary small" data-act="new-chore">Add a chore</button></div>
      <p class="muted" style="margin:0;max-width:62ch">Each chore comes back on its own schedule, counted from the day you last ticked it. Tap a chore to change how often, move the next date, or remove it.</p>
      ${groups || `<p class="muted" style="margin:0">No chores yet. <button class="btn small" data-act="starter">Use the starter list</button></p>`}</section>
    ${backupPanel()}`;
}
function renderSupplies() {
  const shop = shoppingList(), hints = supplies().filter(soon);
  const shopRows = shop.map(x => `<label class="step"><input type="checkbox" data-act="${x.kind === "supply" ? "bought" : "extra-done"}" data-id="${x.id}" aria-label="Bought ${esc(x.name)}">
    ${x.kind === "supply" ? thumb(x, "supply", 34) : thumb({ name: x.name, area: "", icon: "basket" }, "supply", 34)}<span class="txt"><span class="nm">${esc(x.name)}</span><span class="sub">${x.kind === "supply" ? esc(x.area) : "Added by hand"}</span></span></label>`).join("");
  const hintRows = hints.map(s => `<div class="hint">${thumb(s, "supply", 34)}<span>${esc(s.name)}<span class="sub">Bought ${when(s.bought)}, usually lasts ${lastsLabel(s.lasts)}</span></span><button class="btn small" data-act="low" data-id="${s.id}">Add to list</button></div>`).join("");
  const groups = byArea(supplies()).map(([area, ss]) => `<div class="group"><span class="eyebrow"><span class="dot" style="--c:var(--s${tintOf(area)})"></span>${esc(area)}</span>
    ${ss.map(s => `<div class="row${s.low ? " is-low" : ""}"><button class="row-main" data-act="edit-supply" data-id="${s.id}" aria-label="Edit ${esc(s.name)}">${thumb(s, "supply", 48)}
      <span style="min-width:0"><span class="nm" style="display:block">${esc(s.name)}</span><span class="meta">${s.bought ? `Bought ${when(s.bought)} · ` : ""}lasts ${lastsLabel(s.lasts)}</span></span></button>
      <button class="low-btn" data-act="low" data-id="${s.id}" aria-pressed="${!!s.low}">${s.low ? "On the list" : "Running low"}</button></div>`).join("")}</div>`).join("");
  return `<section class="glass panel"><div class="panel-head"><h2>Shopping <em>list</em></h2>${shop.length ? `<button class="btn small" data-act="copy-list">Copy list</button>` : ""}</div>
      ${shop.length ? `<div class="shop">${shopRows}</div><p class="muted" style="margin:0;font-size:13px">Tick things off as you buy them.</p>` : `<p class="muted" style="margin:0">Nothing to buy. Tap “Running low” on any supply below to add it here.</p>`}
      ${hintRows ? `<div style="display:grid;gap:6px"><span class="eyebrow">May run out soon</span>${hintRows}</div>` : ""}
      <form class="add-line" id="extraForm"><input class="input" id="extra-name" placeholder="Add something else, e.g. light bulbs" aria-label="Add something else to the list"><button class="btn" type="submit">Add</button></form>
    </section>
    <section class="glass panel"><div class="panel-head"><h2>Your <em>supplies</em></h2><button class="btn primary small" data-act="new-supply">Add a supply</button></div>

      ${groups || `<p class="muted" style="margin:0">No supplies yet. <button class="btn small" data-act="starter">Use the starter list</button></p>`}</section>`;
}
function backupPanel() {
  if (state.mode !== "local") return "";

    <p class="muted" style="margin:0;max-width:62ch">Your household diary is saved on this device only. Save a backup file now and then, and use it to move to another phone or browser.</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn primary" data-act="backup">Save backup file</button>
      <label class="btn" style="cursor:pointer">Restore from backup<input type="file" accept="application/json,.json" data-act="restore" hidden></label></div></section>`;
}

/* ---------- sheet: add or edit a chore or a supply ---------- */
function draftFrom(kind, x) { return kind === "chore" ? { name: x.name, area: x.area, every: x.every, due: x.due, icon: x.icon || "" } : { name: x.name, area: x.area, lasts: x.lasts, bought: x.bought || "", icon: x.icon || "" } }
function readForm() {
  const s = state.sheet, f = document.getElementById("itemForm"); if (!s || !f) return;
  const v = id => f.querySelector("#" + id)?.value ?? "";
  s.draft.name = v("i-name"); s.draft.area = v("i-area");
  if (s.kind === "chore") { s.draft.every = +v("i-every") || s.draft.every; s.draft.due = v("i-due") || s.draft.due }
  else { s.draft.lasts = +v("i-lasts") || s.draft.lasts; s.draft.bought = v("i-bought") }
}
function options(list, cur) { const has = list.some(([n]) => n === cur); return (has ? list : [...list, [cur, `Every ${cur} days`]]).map(([n, l]) => `<option value="${n}"${n === cur ? " selected" : ""}>${l}</option>`).join("") }
function renderSheet() {
  const root = document.getElementById("sheetRoot"), s = state.sheet;
  if (!s) { root.innerHTML = ""; return }
  const a = document.activeElement;
  if (root.contains(a) && a.matches("input:not([type=checkbox]), select")) return;
  readForm();
  const d = s.draft, chore = s.kind === "chore", preview = { ...d, area: d.area || "Home" };
  const title = s.id ? d.name || (chore ? "Chore" : "Supply") : chore ? "New chore" : "New supply";
  root.innerHTML = `<div class="scrim" data-act="close"></div><aside class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><div style="display:grid;gap:4px"><span class="eyebrow">${chore ? "Chore" : "Supply"}</span><h2>${esc(title)}</h2></div><button class="btn small" data-act="close" aria-label="Close">Close</button></div>
    <form class="sheet-body" id="itemForm">
      <label class="field">${chore ? "What needs doing" : "What it is"}<input class="input" id="i-name" value="${esc(d.name)}" required placeholder="${chore ? "e.g. Water the balcony plants" : "e.g. Dishwasher pills"}"></label>
      <div class="form-grid">
        <label class="field">Area<input class="input" id="i-area" list="area-list" value="${esc(d.area)}" placeholder="e.g. Kitchen"><datalist id="area-list">${areas().map(x => `<option value="${esc(x)}">`).join("")}</datalist></label>
        ${chore ? `<label class="field">How often<select class="input" id="i-every">${options(FREQS, d.every)}</select></label>
          <label class="field">Next due<input class="input" type="date" id="i-due" value="${esc(d.due)}"></label>`
        : `<label class="field">One usually lasts<select class="input" id="i-lasts">${options(LASTS, d.lasts).replace(/Every (\d+) days/, "About $1 days")}</select></label>
          <label class="field">Last bought<input class="input" type="date" id="i-bought" value="${esc(d.bought)}"></label>`}
      </div>
      <div class="field">Icon<div class="icon-grid" role="group" aria-label="Pick an icon">${Object.keys(ICONS).map(n => `<button type="button" data-act="icon-set" data-icon="${n}" title="${n.replace(/-/g, " ")}" aria-pressed="${iconOf(preview, s.kind) === n}" style="--c:var(--s${tintOf(preview.area)})">${svgIcon(n)}</button>`).join("")}</div></div>
      <div class="sheet-foot"><button class="btn primary" type="submit">${s.id ? "Save" : chore ? "Add chore" : "Add supply"}</button>
        <span class="spacer"></span>${s.id ? s.confirm ? `<button class="btn small danger" type="button" data-act="remove-yes">Remove</button><button class="btn small ghost" type="button" data-act="remove-no">Keep</button>` : `<button class="btn small ghost" type="button" data-act="remove">Remove</button>` : ""}</div>
    </form></aside>`;
}
function openSheet(kind, id) {
  const x = id ? (kind === "chore" ? state.chores : state.supplies)[id] : kind === "chore" ? { name: "", area: "", every: 7, due: todayKey() } : { name: "", area: "", lasts: 30 };
  state.sheet = { kind, id, draft: draftFrom(kind, x) }; render();
  if (!id) document.getElementById("i-name")?.focus();
}
function submitSheet() {
  readForm();
  const s = state.sheet, d = s.draft, name = d.name.trim(), area = d.area.trim() || "Home";
  if (!name) { toast(s.kind === "chore" ? "Give the chore a name first." : "Give the supply a name first."); return }
  if (s.kind === "chore") {
    const c = s.id ? { ...state.chores[s.id] } : { id: newId("c"), done: [] };
    Object.assign(c, { name, area, every: d.every, due: d.due || todayKey() }); d.icon ? c.icon = d.icon : delete c.icon;
    saveItem("chores", c); toast(s.id ? "Saved." : `Added “${name}”. It's next due ${when(c.due)}.`);
  } else {
    const x = s.id ? { ...state.supplies[s.id] } : { id: newId("s") };
    Object.assign(x, { name, area, lasts: d.lasts }); d.bought ? x.bought = d.bought : delete x.bought; d.icon ? x.icon = d.icon : delete x.icon;
    saveItem("supplies", x); toast(s.id ? "Saved." : `Added ${name}. Tap “Running low” when it's time to buy more.`);
  }
  state.sheet = null; render();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "tab") { state.tab = el.dataset.tab; state.sheet = null; render(); window.scrollTo(0, 0) }
  else if (act === "week") { const n = +el.dataset.n; state.weekStart = n ? addDays(state.weekStart, 7 * n) : mondayOf(new Date()); render() }
  else if (act === "later") later(id);
  else if (act === "low") { const s = state.supplies[id]; setLow(id, !s.low); if (!s.low) toast(`Added ${s.name} to your shopping list.`) }
  else if (act === "starter") useStarter();
  else if (act === "new-chore") openSheet("chore");
  else if (act === "new-supply") openSheet("supply");
  else if (act === "edit-chore") openSheet("chore", id);
  else if (act === "edit-supply") openSheet("supply", id);
  else if (act === "close") { state.sheet = null; render() }
  else if (act === "icon-set") { readForm(); state.sheet.draft.icon = el.dataset.icon; renderSheet() }
  else if (act === "remove") { readForm(); state.sheet.confirm = true; renderSheet() }
  else if (act === "remove-no") { readForm(); state.sheet.confirm = false; renderSheet() }
  else if (act === "remove-yes") { const s = state.sheet, coll = s.kind === "chore" ? "chores" : "supplies", prev = state[coll][s.id]; state.sheet = null; removeItem(coll, s.id); toast(`Removed “${prev.name}”.`, () => saveItem(coll, prev)) }
  else if (act === "undo") { const u = toast.undo; toast.undo = null; document.getElementById("toast").hidden = true; u?.() }
  else if (act === "copy-list") copyList();
  else if (act === "backup") saveBackup();
});
document.addEventListener("change", e => {
  const el = e.target, act = el.dataset.act, id = el.dataset.id;
  if (act === "tick") tick(id);
  else if (act === "bought") bought(id);
  else if (act === "extra-done") { const x = state.shopping[id]; removeItem("shopping", id); toast(`Ticked off ${x?.name || "that"}.`, x && (() => saveItem("shopping", x))) }
  else if (act === "restore" && el.files?.[0]) restoreBackup(el.files[0]);
  else if (el.id === "i-area") { readForm(); renderSheet() }
});
document.addEventListener("focusout", e => { if (e.target.id === "i-area" || e.target.id === "i-name") setTimeout(renderSheet, 0) });
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.sheet) { state.sheet = null; render() } });
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "itemForm") { document.activeElement?.blur(); submitSheet() }
  else if (e.target.id === "extraForm") {
    const inp = document.getElementById("extra-name"), name = inp.value.trim(); if (!name) return;
    inp.value = ""; inp.blur(); const x = { id: newId("x"), name, added: Date.now() }; saveItem("shopping", x); toast(`Added ${name} to your shopping list.`);
  }
});
async function copyList() {
  const text = shoppingList().map(x => "• " + x.name).join("\n");
  try {
    if (navigator.share && isMobile()) await navigator.share({ title: "Shopping list", text });
    else { await navigator.clipboard.writeText(text); toast("Copied your shopping list. Paste it into a message or your notes.") }
  } catch (err) { if (err?.name !== "AbortError") toast("Couldn't copy the list. Select the items and copy them by hand.") }
}
function saveBackup() {
  const blob = new Blob([JSON.stringify({ app: "household-diary", version: 1, savedAt: new Date().toISOString(), chores: state.chores, supplies: state.supplies, shopping: state.shopping }, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `household-diary-backup-${todayKey()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function restoreBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data?.app !== "household-diary" || typeof data.chores !== "object") throw new Error("not a backup");
    state.chores = data.chores || {}; state.supplies = data.supplies || {}; state.shopping = data.shopping || {}; persistLocal(); render(); toast("Household diary restored.");
  } catch (e) { toast("That file isn't a Household Diary backup.") }
}

/* ---------- boot ---------- */
const mobileMQ = window.matchMedia("(max-width: 700px)");
const isMobile = () => mobileMQ.matches;
document.querySelectorAll("[data-nav]").forEach(svg => svg.innerHTML = NAV_ICONS[svg.dataset.nav]);
/* Re-render after midnight so "today" moves on while the app stays open. */
let shownDay = todayKey();
setInterval(() => { if (todayKey() !== shownDay) { shownDay = todayKey(); render() } }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && todayKey() !== shownDay) { shownDay = todayKey(); render() } });
render();
(async () => {
  try { db = window.claude?.use ? await window.claude.use("db") : null } catch (e) { db = null }
  if (!db) { loadLocal(); return }
  state.mode = "db";
  const lost = () => setStatus("Lost the connection to your saved household diary. Reload the page to reconnect.");
  let pending = 3;
  for (const coll of ["chores", "supplies", "shopping"]) {
    db.collection(coll).onSnapshot(q => {
      const d = {}; q.docs.forEach(x => d[x.id] = { ...x.data(), id: x.id }); state[coll] = d;
      if (pending > 0 && --pending === 0) state.loaded = true;
      render();
    }, lost);
  }
})();
</script>

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
